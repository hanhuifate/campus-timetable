name: Sync Timetable

on:
  schedule:
    - cron: '0 21 * * *' # 每天 05:00（北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-timetable
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CT_USERNAME: ${{ secrets.CT_USERNAME }}
      CT_PASSWORD: ${{ secrets.CT_PASSWORD }}
      CT_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 没配置 Secrets 就跳过
        if: env.CT_USERNAME == ''
        run: echo "仓库没有配置 CT_USERNAME / CT_PASSWORD，跳过抓取"

      - name: 探测学校站点可达性
        if: env.CT_USERNAME != ''
        run: |
          echo "--- DNS ---"
          getent hosts uia.njfu.edu.cn jwxt.njfu.edu.cn || echo "DNS 解析失败"
          echo "--- HTTPS ---"
          curl -sS -o /dev/null -w "uia http_code=%{http_code} time=%{time_total}s\n" --max-time 20 https://uia.njfu.edu.cn/authserver/login || echo "uia 连接失败"
          curl -sS -o /dev/null -w "jwxt http_code=%{http_code} time=%{time_total}s\n" --max-time 20 http://jwxt.njfu.edu.cn/ || echo "jwxt 连接失败"
          echo "--- node fetch ---"
          node -e "const t=Date.now(); fetch('https://uia.njfu.edu.cn/authserver/login').then(r=>console.log('node fetch ok',r.status,Date.now()-t+'ms')).catch(e=>console.log('node fetch ERR',e.message,e.cause&&e.cause.code,Date.now()-t+'ms'))"

      - name: 抓取课表
        if: env.CT_USERNAME != ''
        run: node web/tools/fetch-timetable.js

      - name: 有变化就提交
        if: env.CT_USERNAME != ''
        run: |
          if git diff --quiet -- web/public/data/timetable.json; then
            echo "课表没有变化"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/data/timetable.json
          git commit -m "chore(web): 自动同步课表数据"
          git push
